# A local GLPI for the demo: GLPI's own docker-compose.example.yml (glpi-project/docker-images), pinned, on
# 127.0.0.1:8095 only, in UTC (the seeder and the tools work in UTC). Settings in docker/.env, written by scripts/up.sh.
name: glpi-demo

services:
  glpi:
    image: "glpi/glpi:12.0.1"
    restart: "unless-stopped"
    volumes:
      - glpi_data:/var/glpi
    env_file: .env
    depends_on:
      - db
    ports:
      - "127.0.0.1:8095:80"

  db:
    image: "mysql:8.4"
    restart: "unless-stopped"
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: ${GLPI_DB_NAME}
      MYSQL_USER: ${GLPI_DB_USER}
      MYSQL_PASSWORD: ${GLPI_DB_PASSWORD}
      TZ: UTC

volumes:
  glpi_data:
  db_data:
